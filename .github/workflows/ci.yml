name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon
      - name: Compose UI tests
        run: ./gradlew :composeApp:desktopTest --no-daemon
      - name: Assemble debug
        run: ./gradlew :composeApp:assembleDebug --no-daemon

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Agent contract tests
        run: dotnet test agent/WakeUpMyWall.Agent.slnx
